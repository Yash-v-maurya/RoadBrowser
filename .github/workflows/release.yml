name: Release

# Manual for now: add the signing secrets below, then switch this to a tag trigger
# (uncomment the `push:` block) if you want tags to build and publish automatically.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v2.2)"
        required: true
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ../release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List built APKs
        run: ls -l app/build/renamedApks/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RoadBrowser ${{ inputs.tag }}
          generate_release_notes: true
          files: app/build/renamedApks/release/*.apk
          fail_on_unmatched_files: true

      - name: Remove keystore
        if: always()
        run: rm -f release.keystore
